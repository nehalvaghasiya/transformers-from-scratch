[project]
name = "small-llm-pretraining-finetuning"
version = "0.1.0"
description = "Reproducible small language model pretraining and fine-tuning experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["small-llm-pretraining", "small-llm-finetuning"]

# Select exactly one Torch source; both experiments use custom PyTorch models.
[project.optional-dependencies]
cpu = [
    "torch==2.8.0",
    "numpy>=2,<3",
]
cu126 = [
    "torch==2.8.0",
    "numpy>=2,<3",
]
cu128 = [
    "torch==2.8.0",
    "numpy>=2,<3",
]

[dependency-groups]
dev = ["mypy>=1.18,<2", "pytest>=8,<10", "ruff>=0.14,<1"]
demo = ["gradio>=6,<7"]
pretraining = ["scikit-learn>=1.8,<2", "matplotlib>=3.10,<4"]
media = ["playwright>=1.58,<2", "imageio-ffmpeg>=0.6,<1"]

[tool.uv]
package = false
required-version = ">=0.12.1,<0.13"
prerelease = "disallow"
# Supported platform: Linux/WSL x86-64; CPU is the verified runtime.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }],
    [{ extra = "cpu" }, { extra = "cu128" }],
    [{ extra = "cu126" }, { extra = "cu128" }],
]

[tool.uv.workspace]
members = ["pretraining", "finetuning"]

[tool.uv.sources]
small-llm-pretraining = { workspace = true }
small-llm-finetuning = { workspace = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
src = ["pretraining/src", "finetuning/src"]
extend-exclude = ["pretrained"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pretraining/src/pretraining", "finetuning/src/finetuning"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "matplotlib.*", "gradio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pretraining/tests", "finetuning/tests"]
addopts = "-ra"

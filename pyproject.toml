[project]
name = "small-llm-pretraining-finetuning"
version = "0.1.0"
description = "Reproducible small language model pretraining and fine-tuning experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["small-llm-pretraining", "small-llm-finetuning"]

# Keep the shared stack identical in each profile. Putting PEFT in the base
# dependencies would allow its transitive Torch dependency to bypass selection.
[project.optional-dependencies]
cpu = [
    "torch==2.8.0",
    "transformers>=4.57,<6",
    "peft>=0.18,<1",
    "datasets>=4,<5",
    "accelerate>=1.10,<2",
    "tokenizers>=0.22,<1",
    "huggingface-hub>=0.34,<2",
    "numpy>=2,<3",
    "safetensors>=0.6,<1",
]
cu126 = [
    "torch==2.8.0",
    "transformers>=4.57,<6",
    "peft>=0.18,<1",
    "datasets>=4,<5",
    "accelerate>=1.10,<2",
    "tokenizers>=0.22,<1",
    "huggingface-hub>=0.34,<2",
    "numpy>=2,<3",
    "safetensors>=0.6,<1",
]
cu128 = [
    "torch==2.8.0",
    "transformers>=4.57,<6",
    "peft>=0.18,<1",
    "datasets>=4,<5",
    "accelerate>=1.10,<2",
    "tokenizers>=0.22,<1",
    "huggingface-hub>=0.34,<2",
    "numpy>=2,<3",
    "safetensors>=0.6,<1",
]

[dependency-groups]
dev = ["mypy>=1.18,<2", "pytest>=8,<10", "ruff>=0.14,<1"]
demo = ["gradio>=6,<7"]

[tool.uv]
package = false
required-version = ">=0.12.1,<0.13"
prerelease = "disallow"
# Supported targets: the Linux/WSL x86-64 laptop and Linux x86-64 HF Space.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }],
    [{ extra = "cpu" }, { extra = "cu128" }],
    [{ extra = "cu126" }, { extra = "cu128" }],
]

[tool.uv.workspace]
members = ["pretraining", "finetuning"]

[tool.uv.sources]
small-llm-pretraining = { workspace = true }
small-llm-finetuning = { workspace = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pretraining/src/pretraining", "finetuning/src/finetuning"]
